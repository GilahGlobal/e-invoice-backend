paths:
  /admin/aggregators:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all aggregators in the system.
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: size
        type: integer
      - description: Search query
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AdminAggregatorListResponseDto'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: List Aggregators
      tags:
      - Admin Queries
    post:
      consumes:
      - application/json
      description: Creates a new aggregator (admin only).
      parameters:
      - description: Aggregator request payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/admin.AdminCreateAggregatorDto'
      produces:
      - application/json
      responses:
        "201":
          description: Aggregator created successfully
          schema:
            $ref: '#/definitions/utility.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Create Aggregator
      tags:
      - Admin Operations
  /admin/aggregators/{id}:
    get:
      consumes:
      - application/json
      description: Returns stats and associated companies for an aggregator.
      parameters:
      - description: Aggregator ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AdminAggregatorInfoResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Aggregator Info
      tags:
      - Admin Queries
    put:
      consumes:
      - application/json
      description: Updates aggregator details and status.
      parameters:
      - description: Aggregator ID
        in: path
        name: id
        required: true
        type: string
      - description: Aggregator update payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/admin.AdminUpdateBusinessDto'
      produces:
