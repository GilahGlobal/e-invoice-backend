{{define "button"}}
<div style="margin: 24px 0 20px 0;">
  <a href="{{.URL}}" style="display: block; width: 100%; box-sizing: border-box; text-align: center; background-color: #5b21b6; color: #ffffff; padding: 15px 24px; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 15px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; box-shadow: 0 2px 4px rgba(91, 33, 182, 0.2);">{{.Text}}</a>
</div>
{{end}}
