{{define "header"}}
<table style="width: 100%; border-collapse: collapse; border-bottom: 1px solid #f1f5f9; background-color: #ffffff;">
  <tr>
    <td style="padding: 24px 32px; vertical-align: middle; text-align: left;">
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
        <tr>
          <td style="vertical-align: middle;">
            <div style="background-color: #5b21b6; width: 34px; height: 34px; border-radius: 8px; text-align: center; line-height: 34px; color: #ffffff; font-weight: 800; font-size: 19px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">N</div>
          </td>
          <td style="vertical-align: middle; padding-left: 10px;">
            <span style="font-size: 21px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">Nexar</span>
          </td>
        </tr>
      </table>
    </td>
    <td style="padding: 24px 32px; vertical-align: middle; text-align: right;">
      {{if .NoticeType}}
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #7c3aed; text-transform: uppercase; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">{{.NoticeType}}</span>
      {{end}}
    </td>
  </tr>
</table>
{{end}}
